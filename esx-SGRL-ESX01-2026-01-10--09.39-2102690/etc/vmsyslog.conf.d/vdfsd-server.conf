[vmsyslog-logger]

# unique id for this logger
id = vdfs-server

# description of this logger
descr = VDFS server logs

# descriptive name for this logger
name = vdfstool server logs

# idents this logger is interested in
idents = vdfsd-server

# output file (e.g. foo == /var/log/foo.log)
file = vdfsd-server

# file logger class
fclass = FileLoggerMessageOnly

# network logger class
nclass = NetworkFilterVmacoreLogLine

# max size of the log files, in kb
size = 10240

